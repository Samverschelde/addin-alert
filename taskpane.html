<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beschikbaarheid medewerkers</title>

  <!-- Office.js & MSAL -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
      padding: 12px;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      color: #0078d4;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #0078d4;
    }

    .sectie { margin-bottom: 14px; }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }

    input[type="date"], input[type="text"] {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 13px;
    }

    .rij-datum { display: flex; gap: 8px; }
    .rij-datum > div { flex: 1; }

    .medewerker-lijst {
      list-style: none;
      margin-bottom: 6px;
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 3px;
      padding: 4px;
    }

    .medewerker-lijst li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 6px;
      border-radius: 2px;
    }
    .medewerker-lijst li:hover { background: #f5f5f5; }

    .medewerker-lijst li span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .verwijder-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      font-size: 15px;
      line-height: 1;
      padding: 0 2px;
    }
    .verwijder-btn:hover { color: #c00; }

    .toevoeg-rij { display: flex; gap: 6px; }
    .toevoeg-rij input { flex: 1; }

    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-primair {
      background: #0078d4;
      color: #fff;
      width: 100%;
      padding: 8px;
    }
    .btn-primair:hover { background: #006cbe; }
    .btn-primair:disabled { background: #a0c4e8; cursor: default; }

    .btn-klein {
      background: #f0f0f0;
      color: #333;
      white-space: nowrap;
    }
    .btn-klein:hover { background: #e0e0e0; }

    .status {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
      min-height: 16px;
    }
    .status.fout { color: #c00; }
    .status.ok { color: #107c10; }

    #resultaten { margin-top: 10px; }

    .slot-kaart {
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .slot-kaart:hover { background: #f0f7ff; border-color: #0078d4; }
    .slot-kaart.geselecteerd { background: #e8f3fb; border-color: #0078d4; }

    .slot-kaart .datum { font-weight: 600; font-size: 13px; }
    .slot-kaart .deel { color: #0078d4; font-size: 12px; }
    .slot-kaart .vrij-check { float: right; color: #107c10; font-size: 16px; }

    .geen-slots {
      color: #666;
      font-style: italic;
      font-size: 12px;
      padding: 8px;
    }

    #invoeg-sectie { margin-top: 10px; display: none; }

    .invoeg-preview {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 3px;
      padding: 8px;
      font-size: 12px;
      color: #333;
      margin-bottom: 8px;
      white-space: pre-wrap;
    }

    .aanmelding-sectie {
      text-align: center;
      padding: 20px 0;
    }
    .aanmelding-sectie p {
      color: #666;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .loader {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid #ccc;
      border-top-color: #0078d4;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<h1>📅 Beschikbaarheid</h1>

<!-- AANMELDING (verborgen na login) -->
<div id="aanmelding-sectie" class="aanmelding-sectie" style="display:none">
  <p>Meld je aan met je Microsoft 365-account om agenda's te raadplegen.</p>
  <button class="btn btn-primair" onclick="aanmelden()" style="width:auto;padding:8px 20px">
    Aanmelden bij Microsoft 365
  </button>
  <div id="aanmelding-status" class="status"></div>
</div>

<!-- HOOFDFORMULIER -->
<div id="hoofdformulier">

  <!-- Datumbereik -->
  <div class="sectie">
    <label>Periode</label>
    <div class="rij-datum">
      <div>
        <label style="font-weight:normal;font-size:11px">Van</label>
        <input type="date" id="datum-van">
      </div>
      <div>
        <label style="font-weight:normal;font-size:11px">Tot</label>
        <input type="date" id="datum-tot">
      </div>
    </div>
  </div>

  <!-- Medewerkers -->
  <div class="sectie">
    <label>Medewerkers</label>
    <ul class="medewerker-lijst" id="medewerker-lijst"></ul>
    <div class="toevoeg-rij">
      <input type="text" id="nieuw-email" placeholder="voornaam.naam@alert-opleidingen.be"
             onkeydown="if(event.key==='Enter') voegToe()">
      <button class="btn btn-klein" onclick="voegToe()">+ Toevoegen</button>
    </div>
  </div>

  <!-- Knop -->
  <button class="btn btn-primair" id="check-btn" onclick="checkBeschikbaarheid()">
    Bekijk beschikbaarheid
  </button>
  <div id="check-status" class="status"></div>

  <!-- Resultaten -->
  <div id="resultaten"></div>

  <!-- Invoegen in e-mail -->
  <div id="invoeg-sectie">
    <div class="invoeg-preview" id="invoeg-preview"></div>
    <button class="btn btn-primair" onclick="voegInEmail()">
      ✉️ Voeg in e-mail in
    </button>
  </div>

</div>

<script>
// ─── CONFIGURATIE ────────────────────────────────────────────────────────────
// ⚠️  Pas CLIENT_ID en TENANT_ID aan na Azure AD-registratie (zie README)
const CLIENT_ID = "c46ba8cd-2ad8-4752-965a-d288a9473811";
const TENANT_ID = "0cfe6e5e-f690-443a-857f-7b5b22415fca";

const SCOPES = ["Calendars.Read", "Calendars.Read.Shared"];

// Werkuren (Belgische tijd)
const VM_START = 8;   // 08:00
const VM_EIND  = 13;  // 13:00
const NM_START = 13;  // 13:00
const NM_EIND  = 18;  // 18:00

// ─── MSAL INSTANTIE ──────────────────────────────────────────────────────────
let msalInstantie = null;
let huidigAccount = null;

function initMsal() {
  try {
    msalInstantie = new msal.PublicClientApplication({
      auth: {
        clientId:    CLIENT_ID,
        authority:   `https://login.microsoftonline.com/${TENANT_ID}`,
        redirectUri: window.location.origin + "/addin/auth",
      },
      cache: { cacheLocation: "localStorage" },
    });
    const accounts = msalInstantie.getAllAccounts();
    if (accounts.length > 0) {
      huidigAccount = accounts[0];
      document.getElementById("aanmelding-sectie").style.display = "none";
      document.getElementById("hoofdformulier").style.display    = "";
    } else {
      document.getElementById("aanmelding-sectie").style.display = "";
      document.getElementById("hoofdformulier").style.display    = "none";
    }
  } catch (e) {
    console.error("MSAL init fout:", e);
  }
}

async function aanmelden() {
  const st = document.getElementById("aanmelding-status");
  st.textContent = "Bezig met aanmelden…";
  try {
    const result = await msalInstantie.loginPopup({ scopes: SCOPES });
    huidigAccount = result.account;
    document.getElementById("aanmelding-sectie").style.display = "none";
    document.getElementById("hoofdformulier").style.display    = "";
    st.textContent = "";
  } catch (e) {
    st.className = "status fout";
    st.textContent = "Aanmelden mislukt: " + (e.message || e);
  }
}

async function getToken() {
  try {
    const r = await msalInstantie.acquireTokenSilent({ scopes: SCOPES, account: huidigAccount });
    return r.accessToken;
  } catch {
    const r = await msalInstantie.acquireTokenPopup({ scopes: SCOPES });
    huidigAccount = r.account;
    return r.accessToken;
  }
}

// ─── MEDEWERKERS ─────────────────────────────────────────────────────────────
function laadMedewerkers() {
  const opgeslagen = localStorage.getItem("medewerkers");
  return opgeslagen ? JSON.parse(opgeslagen) : [];
}

function slaOpMedewerkers(lijst) {
  localStorage.setItem("medewerkers", JSON.stringify(lijst));
}

function toonMedewerkerLijst() {
  const lijst    = laadMedewerkers();
  const ul       = document.getElementById("medewerker-lijst");
  ul.innerHTML   = "";
  if (lijst.length === 0) {
    ul.innerHTML = '<li style="color:#aaa;font-size:12px;padding:4px 6px">Nog geen medewerkers toegevoegd</li>';
    return;
  }
  lijst.forEach((email, i) => {
    const li = document.createElement("li");
    li.innerHTML = `
      <span title="${email}">${email}</span>
      <button class="verwijder-btn" onclick="verwijderMedewerker(${i})" title="Verwijder">×</button>`;
    ul.appendChild(li);
  });
}

function voegToe() {
  const input = document.getElementById("nieuw-email");
  const email = input.value.trim().toLowerCase();
  if (!email || !email.includes("@")) return;
  const lijst = laadMedewerkers();
  if (!lijst.includes(email)) {
    lijst.push(email);
    slaOpMedewerkers(lijst);
    toonMedewerkerLijst();
  }
  input.value = "";
}

function verwijderMedewerker(index) {
  const lijst = laadMedewerkers();
  lijst.splice(index, 1);
  slaOpMedewerkers(lijst);
  toonMedewerkerLijst();
}

// ─── DATUMS INSTELLEN ────────────────────────────────────────────────────────
function setStandaardDatums() {
  const vandaag = new Date();
  const over2w  = new Date(vandaag);
  over2w.setDate(vandaag.getDate() + 14);

  const fmt = d => d.toISOString().split("T")[0];
  document.getElementById("datum-van").value = fmt(vandaag);
  document.getElementById("datum-tot").value = fmt(over2w);
}

// ─── BESCHIKBAARHEID OPHALEN ─────────────────────────────────────────────────
let geselecteerdeSloten = [];

async function checkBeschikbaarheid() {
  const medewerkers = laadMedewerkers();
  if (medewerkers.length === 0) {
    zetStatus("Voeg eerst medewerkers toe.", "fout");
    return;
  }

  const van = document.getElementById("datum-van").value;
  const tot = document.getElementById("datum-tot").value;
  if (!van || !tot) {
    zetStatus("Kies een datumbereik.", "fout");
    return;
  }

  const btn = document.getElementById("check-btn");
  btn.disabled = true;
  zetStatus('<span class="loader"></span>Agenda\'s ophalen…', "");
  document.getElementById("resultaten").innerHTML = "";
  document.getElementById("invoeg-sectie").style.display = "none";
  geselecteerdeSloten = [];

  try {
    const token = await getToken();

    // Graph getSchedule: maximaal 20 personen per call, 42 dagen window
    const response = await fetch(
      "https://graph.microsoft.com/v1.0/me/calendar/getSchedule",
      {
        method:  "POST",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type":  "application/json",
        },
        body: JSON.stringify({
          schedules:                 medewerkers,
          startTime: { dateTime: van + "T00:00:00", timeZone: "Europe/Brussels" },
          endTime:   { dateTime: tot + "T23:59:59", timeZone: "Europe/Brussels" },
          availabilityViewInterval:  60,  // 1 uur per slot
        }),
      }
    );

    if (!response.ok) {
      const fout = await response.json();
      throw new Error(fout.error?.message || response.statusText);
    }

    const data     = await response.json();
    const schema   = data.value;          // array, één item per medewerker
    const vrije    = berekenVrijeSloten(schema, van, tot);

    toonResultaten(vrije);
    zetStatus(`${schema.length} medewerker(s) geraadpleegd.`, "ok");
  } catch (e) {
    zetStatus("Fout: " + (e.message || e), "fout");
  } finally {
    btn.disabled = false;
  }
}

/**
 * Berekent aaneengesloten voormiddag/namiddag-blokken waarop ALLE
 * medewerkers vrij zijn.
 *
 * @param {Array} schema  - Graph getSchedule response.value
 * @param {string} van    - ISO date string (YYYY-MM-DD)
 * @param {string} tot    - ISO date string (YYYY-MM-DD)
 * @returns {Array<{datum, deel, label}>}
 */
function berekenVrijeSloten(schema, van, tot) {
  if (!schema || schema.length === 0) return [];

  // Bouw per medewerker een set van bezette uren
  // availabilityView: string, 1 char per uur, start van de window
  // '0'=vrij, '1'=tentative, '2'=bezet, '3'=afwezig, '4'=elders

  const vanDt = new Date(van + "T00:00:00");

  // Elke char in availabilityView stelt 1 uur voor, te rekenen vanaf vanDt 00:00
  // Bouw voor elke medewerker een array van bezette uursloten (index = uur offset)
  const bezettingen = schema.map(m => {
    const view = (m.availabilityView || "");
    return view.split("").map(c => c !== "0");  // true = bezet/tentative/weg
  });

  const resultaat = [];
  const datumCursor = new Date(vanDt);
  const totDt = new Date(tot + "T00:00:00");

  while (datumCursor <= totDt) {
    const dag = datumCursor.getDay(); // 0=zondag, 6=zaterdag
    if (dag !== 0 && dag !== 6) {    // alleen weekdagen
      // Offset in uren tov het begin van de window
      const dagOffset = Math.round((datumCursor - vanDt) / 3600000);

      // Voormiddag: uren 8–12 (5 uur), allemaal vrij?
      const vmVrij = [VM_START, VM_START+1, VM_START+2, VM_START+3, VM_START+4]
        .every(h => bezettingen.every(b => !b[dagOffset + h]));

      // Namiddag: uren 13–17 (5 uur), allemaal vrij?
      const nmVrij = [NM_START, NM_START+1, NM_START+2, NM_START+3, NM_START+4]
        .every(h => bezettingen.every(b => !b[dagOffset + h]));

      const datumStr = datumCursor.toLocaleDateString("nl-BE", {
        weekday: "long", day: "numeric", month: "long"
      });

      if (vmVrij) resultaat.push({ datum: datumStr, deel: "voormiddag", datumObj: new Date(datumCursor) });
      if (nmVrij) resultaat.push({ datum: datumStr, deel: "namiddag",   datumObj: new Date(datumCursor) });
    }
    datumCursor.setDate(datumCursor.getDate() + 1);
  }

  return resultaat;
}

function toonResultaten(sloten) {
  const div = document.getElementById("resultaten");
  if (sloten.length === 0) {
    div.innerHTML = '<p class="geen-slots">Geen gemeenschappelijke vrije voormiddagen of namiddagen gevonden in deze periode.</p>';
    return;
  }

  // Toon max 10 slots
  const zichtbaar = sloten.slice(0, 10);
  div.innerHTML = `
    <p style="font-size:12px;color:#555;margin-bottom:6px">
      Klik op een tijdslot om te selecteren (meerdere mogelijk):
    </p>
    ${zichtbaar.map((s, i) => `
      <div class="slot-kaart" id="slot-${i}" onclick="toggleSlot(${i})">
        <span class="vrij-check" id="check-${i}" style="display:none">✓</span>
        <div class="datum">${s.datum}</div>
        <div class="deel">${s.deel === "voormiddag" ? "🌅 Voormiddag (08:00–13:00)" : "🌆 Namiddag (13:00–18:00)"}</div>
      </div>`).join("")}
  `;

  // Sla sloten op voor toggleSlot
  window._sloten = zichtbaar;
}

function toggleSlot(i) {
  const kaart = document.getElementById(`slot-${i}`);
  const check = document.getElementById(`check-${i}`);
  const idx   = geselecteerdeSloten.indexOf(i);

  if (idx >= 0) {
    geselecteerdeSloten.splice(idx, 1);
    kaart.classList.remove("geselecteerd");
    check.style.display = "none";
  } else {
    geselecteerdeSloten.push(i);
    kaart.classList.add("geselecteerd");
    check.style.display = "";
  }

  bijwerkInvoegSectie();
}

function bijwerkInvoegSectie() {
  const sectie  = document.getElementById("invoeg-sectie");
  const preview = document.getElementById("invoeg-preview");

  if (geselecteerdeSloten.length === 0) {
    sectie.style.display = "none";
    return;
  }

  const tekst = maakTekst();
  preview.textContent = tekst;
  sectie.style.display = "";
}

function maakTekst() {
  const gesorteerd = [...geselecteerdeSloten].sort((a,b) => {
    const sa = window._sloten[a], sb = window._sloten[b];
    if (sa.datumObj < sb.datumObj) return -1;
    if (sa.datumObj > sb.datumObj) return  1;
    return sa.deel === "voormiddag" ? -1 : 1;
  });

  const opties = gesorteerd.map(i => {
    const s = window._sloten[i];
    // Korte notatie: "maandag 18 augustus voormiddag"
    return s.datum + " " + s.deel;
  });

  if (opties.length === 1) return opties[0];
  if (opties.length === 2) return opties[0] + " of " + opties[1];
  return opties.slice(0, -1).join(", ") + " of " + opties[opties.length - 1];
}

async function voegInEmail() {
  const tekst = maakTekst();
  try {
    await new Promise((ok, nok) => {
      Office.context.mailbox.item.body.setSelectedDataAsync(
        tekst,
        { coercionType: Office.CoercionType.Text },
        r => r.status === Office.AsyncResultStatus.Succeeded ? ok() : nok(r.error)
      );
    });
    zetStatus("✓ Ingevoegd in e-mail.", "ok");
  } catch (e) {
    // Niet in compose-modus: kopieer naar klembord
    try {
      await navigator.clipboard.writeText(tekst);
      zetStatus("Gekopieerd naar klembord (plak in e-mail met Ctrl+V).", "ok");
    } catch {
      zetStatus("Kon niet invoegen. Kopieer handmatig: " + tekst, "fout");
    }
  }
}

// ─── HULPFUNCTIES ─────────────────────────────────────────────────────────────
function zetStatus(bericht, type) {
  const el = document.getElementById("check-status");
  el.innerHTML  = bericht;
  el.className  = "status" + (type ? " " + type : "");
}

// ─── INITIALISATIE ────────────────────────────────────────────────────────────
Office.onReady(() => {
  setStandaardDatums();
  toonMedewerkerLijst();

  if (CLIENT_ID === "JOUW_CLIENT_ID_HIER") {
    document.getElementById("check-status").className = "status fout";
    document.getElementById("check-status").textContent =
      "⚠️  Stel eerst CLIENT_ID en TENANT_ID in (zie setup-instructies).";
    document.getElementById("aanmelding-sectie").style.display = "none";
    return;
  }

  initMsal();
});
</script>
</body>
</html>
